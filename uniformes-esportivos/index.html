<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mega Sports | Teste do Mapa Virtual</title>
<style>
:root{--orange:#ff6500;--line:#e4e7ea}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f5f6f7;color:#171717}
header{background:#fff;border-bottom:1px solid var(--line);padding:16px 22px;font-size:26px;font-weight:900}
header span{color:var(--orange)}
main{width:min(1260px,calc(100% - 20px));margin:14px auto;display:grid;grid-template-columns:1fr 320px;gap:14px}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 12px 32px rgba(0,0,0,.07)}
.stage{padding:18px}
.stage svg{width:100%;height:auto}
.controls{padding:14px}
.controls h3{font-size:12px;margin:14px 0 8px}
.row{display:grid;grid-template-columns:1fr 56px;gap:8px;align-items:center;margin:8px 0}
.row label{font-size:12px;font-weight:700}
input[type=color]{width:56px;height:38px;border:1px solid var(--line);border-radius:9px;padding:3px;background:#fff}
.upload{border:1px dashed #c9ced2;border-radius:9px;padding:9px;margin:8px 0}
.upload label{font-size:11px;font-weight:800;display:block;margin-bottom:5px}
.upload input{width:100%;font-size:11px}
.note{font-size:10px;color:#737b81;line-height:1.45}
@media(max-width:850px){main{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>MEGA <span>SPORTS</span> · MAPA VIRTUAL</header>
<main>
  <section class="panel">
    <div class="stage">
      <!-- SVG INLINE: o HTML consegue comandar cada parte por ID -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 390" id="megaSportsMap">
  <defs>
    <!-- Cada clipPath usa exatamente a geometria da peça -->
    <clipPath id="clip-front-body"><use href="#front-body-shape"/></clipPath>
    <clipPath id="clip-front-sleeve-left"><use href="#front-sleeve-left-shape"/></clipPath>
    <clipPath id="clip-front-sleeve-right"><use href="#front-sleeve-right-shape"/></clipPath>
    <clipPath id="clip-front-collar-a"><use href="#front-collar-a-shape"/></clipPath>
    <clipPath id="clip-front-collar-b"><use href="#front-collar-b-shape"/></clipPath>

    <clipPath id="clip-back-body"><use href="#back-body-shape"/></clipPath>
    <clipPath id="clip-back-sleeve-left"><use href="#back-sleeve-left-shape"/></clipPath>
    <clipPath id="clip-back-sleeve-right"><use href="#back-sleeve-right-shape"/></clipPath>
    <clipPath id="clip-back-collar"><use href="#back-collar-shape"/></clipPath>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity=".16"/>
    </filter>
  </defs>

  <!-- ==================== FRENTE ==================== -->
  <g id="front-map" transform="translate(0,0)" filter="url(#softShadow)">
    <!-- Shapes geométricos oficiais do mapa -->
    <g id="front-shapes" fill="#fff" stroke="#202428" stroke-width="1.25" stroke-linejoin="round">
      <path id="front-body-shape"
        d="M174 28
           C180 43 190 60 208 79
           C226 60 236 43 242 28
           C262 37 284 45 304 55
           C310 74 306 92 301 108
           C298 119 301 131 311 142
           C305 182 304 227 305 270
           C306 309 312 343 317 370
           C282 372 244 372 208 371
           C172 372 134 372 99 370
           C104 343 110 309 111 270
           C112 227 111 182 105 142
           C115 131 118 119 115 108
           C110 92 106 74 112 55
           C132 45 154 37 174 28 Z"/>

      <path id="front-sleeve-left-shape"
        d="M174 28
           C151 37 132 45 112 55
           C90 70 64 87 28 114
           L58 164
           C74 155 90 147 105 142
           C115 131 118 119 115 108
           C110 92 106 74 112 55
           C132 45 154 37 174 28 Z"/>

      <path id="front-sleeve-right-shape"
        d="M242 28
           C265 37 284 45 304 55
           C326 70 352 87 388 114
           L358 164
           C342 155 326 147 311 142
           C301 131 298 119 301 108
           C306 92 310 74 304 55
           C284 45 265 37 242 28 Z"/>

      <!-- Gola dividida em A/B -->
      <path id="front-collar-a-shape"
        d="M174 28
           C184 24 195 22 208 22
           C221 22 232 24 242 28
           C237 37 228 45 208 50
           C188 45 179 37 174 28 Z"/>

      <path id="front-collar-b-shape"
        d="M174 28
           C179 40 190 59 208 79
           C226 59 237 40 242 28
           C232 34 222 38 208 40
           C194 38 184 34 174 28 Z"/>
    </g>

    <!-- Containers para PowerClip digital -->
    <g id="front-powerclips">
      <g id="front-body-container" clip-path="url(#clip-front-body)">
        <rect id="front-body-fill" x="90" y="20" width="235" height="355" fill="#ffffff"/>
        <image id="front-body-image" href="" x="90" y="20" width="235" height="355" preserveAspectRatio="xMidYMid slice" opacity="0"/>
      </g>

      <g id="front-sleeve-left-container" clip-path="url(#clip-front-sleeve-left)">
        <rect id="front-sleeve-left-fill" x="20" y="20" width="165" height="155" fill="#ffffff"/>
        <image id="front-sleeve-left-image" href="" x="20" y="20" width="165" height="155" preserveAspectRatio="xMidYMid slice" opacity="0"/>
      </g>

      <g id="front-sleeve-right-container" clip-path="url(#clip-front-sleeve-right)">
        <rect id="front-sleeve-right-fill" x="232" y="20" width="165" height="155" fill="#ffffff"/>
        <image id="front-sleeve-right-image" href="" x="232" y="20" width="165" height="155" preserveAspectRatio="xMidYMid slice" opacity="0"/>
      </g>

      <g id="front-collar-a-container" clip-path="url(#clip-front-collar-a)">
        <rect id="front-collar-a-fill" x="165" y="15" width="90" height="50" fill="#ffffff"/>
      </g>
      <g id="front-collar-b-container" clip-path="url(#clip-front-collar-b)">
        <rect id="front-collar-b-fill" x="165" y="20" width="90" height="70" fill="#d9d9d9"/>
      </g>
    </g>

    <!-- Contornos acima das imagens, para encaixe visual perfeito -->
    <g id="front-outline" fill="none" stroke-width="1.2">
      <use href="#front-body-shape" stroke="#4a9d6d"/>
      <use href="#front-sleeve-left-shape" stroke="#ef4f4f"/>
      <use href="#front-sleeve-right-shape" stroke="#ef4f4f"/>
      <use href="#front-collar-a-shape" stroke="#202428"/>
      <use href="#front-collar-b-shape" stroke="#202428"/>
    </g>
  </g>

  <!-- ==================== COSTAS ==================== -->
  <g id="back-map" transform="translate(385,0)" filter="url(#softShadow)">
    <g id="back-shapes" fill="#fff" stroke="#202428" stroke-width="1.25" stroke-linejoin="round">
      <path id="back-body-shape"
        d="M161 31
           C177 20 191 17 208 17
           C225 17 239 20 255 31
           C278 38 302 46 323 58
           C328 80 328 97 323 116
           C320 128 322 139 331 151
           C326 192 325 233 326 276
           C327 313 333 344 337 368
           C294 373 250 376 208 377
           C166 376 122 373 79 368
           C83 344 89 313 90 276
           C91 233 90 192 85 151
           C94 139 96 128 93 116
           C88 97 88 80 93 58
           C114 46 138 38 161 31 Z"/>

      <path id="back-sleeve-left-shape"
        d="M161 31
           C137 38 114 46 93 58
           C69 74 46 89 13 111
           L47 162
           C61 156 73 153 85 151
           C94 139 96 128 93 116
           C88 97 88 80 93 58
           C114 46 138 38 161 31 Z"/>

      <path id="back-sleeve-right-shape"
        d="M255 31
           C279 38 302 46 323 58
           C347 74 370 89 403 111
           L369 162
           C355 156 343 153 331 151
           C322 139 320 128 323 116
           C328 97 328 80 323 58
           C302 46 279 38 255 31 Z"/>

      <path id="back-collar-shape"
        d="M161 31
           C177 20 191 17 208 17
           C225 17 239 20 255 31
           C246 40 228 45 208 46
           C188 45 170 40 161 31 Z"/>
    </g>

    <g id="back-powerclips">
      <g id="back-body-container" clip-path="url(#clip-back-body)">
        <rect id="back-body-fill" x="70" y="15" width="275" height="365" fill="#ffffff"/>
        <image id="back-body-image" href="" x="70" y="15" width="275" height="365" preserveAspectRatio="xMidYMid slice" opacity="0"/>
      </g>

      <g id="back-sleeve-left-container" clip-path="url(#clip-back-sleeve-left)">
        <rect id="back-sleeve-left-fill" x="5" y="20" width="165" height="155" fill="#ffffff"/>
      </g>
      <g id="back-sleeve-right-container" clip-path="url(#clip-back-sleeve-right)">
        <rect id="back-sleeve-right-fill" x="246" y="20" width="165" height="155" fill="#ffffff"/>
      </g>
      <g id="back-collar-container" clip-path="url(#clip-back-collar)">
        <rect id="back-collar-fill" x="150" y="10" width="115" height="55" fill="#ffffff"/>
      </g>
    </g>

    <g id="back-outline" fill="none" stroke="#202428" stroke-width="1.2">
      <use href="#back-body-shape"/>
      <use href="#back-sleeve-left-shape"/>
      <use href="#back-sleeve-right-shape"/>
      <use href="#back-collar-shape"/>
    </g>
  </g>
</svg>
    </div>
  </section>

  <aside class="panel">
    <div class="controls">
      <h3>CORES · FRENTE</h3>
      <div class="row"><label>Corpo</label><input id="fc" type="color" value="#ffffff"></div>
      <div class="row"><label>Manga esquerda</label><input id="fsl" type="color" value="#ffffff"></div>
      <div class="row"><label>Manga direita</label><input id="fsr" type="color" value="#ffffff"></div>
      <div class="row"><label>Gola A</label><input id="fca" type="color" value="#ffffff"></div>
      <div class="row"><label>Gola B</label><input id="fcb" type="color" value="#d9d9d9"></div>

      <h3>POWERCLIP · CORPO</h3>
      <div class="upload">
        <label>Estampa retangular da frente</label>
        <input id="frontUpload" type="file" accept="image/*">
      </div>
      <div class="upload">
        <label>Estampa retangular das costas</label>
        <input id="backUpload" type="file" accept="image/*">
      </div>

      <h3>CORES · COSTAS</h3>
      <div class="row"><label>Corpo</label><input id="bc" type="color" value="#ffffff"></div>
      <div class="row"><label>Manga esquerda</label><input id="bsl" type="color" value="#ffffff"></div>
      <div class="row"><label>Manga direita</label><input id="bsr" type="color" value="#ffffff"></div>
      <div class="row"><label>Gola</label><input id="bcol" type="color" value="#ffffff"></div>

      <div class="note">Este arquivo é o mapa, não o simulador final. Cada peça tem um ID próprio e pode receber cor ou imagem independentemente.</div>
    </div>
  </aside>
</main>

<script>
const $=s=>document.getElementById(s);
function fill(inputId,targetId){$(inputId).oninput=e=>$(targetId).setAttribute("fill",e.target.value)}
fill("fc","front-body-fill");
fill("fsl","front-sleeve-left-fill");
fill("fsr","front-sleeve-right-fill");
fill("fca","front-collar-a-fill");
fill("fcb","front-collar-b-fill");
fill("bc","back-body-fill");
fill("bsl","back-sleeve-left-fill");
fill("bsr","back-sleeve-right-fill");
fill("bcol","back-collar-fill");

function powerClip(inputId,imageId){
  $(inputId).onchange=e=>{
    const f=e.target.files && e.target.files[0];
    if(!f)return;
    const r=new FileReader();
    r.onload=()=>{
      const img=$(imageId);
      img.setAttribute("href",r.result);
      img.setAttribute("opacity","1");
    };
    r.readAsDataURL(f);
  }
}
powerClip("frontUpload","front-body-image");
powerClip("backUpload","back-body-image");
</script>
</body>
</html>
