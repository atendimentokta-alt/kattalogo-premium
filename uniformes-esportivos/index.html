<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff6500">
<title>Mega Sports | Estúdio 2D Premium</title>
<style>
:root{
  --orange:#ff6500;
  --ink:#182028;
  --muted:#727b83;
  --line:#e4e8eb;
  --panel:#fff;
  --bg:#edf1f3;
  --body:#ffe44d;
  --left:#ffe44d;
  --right:#ffe44d;
  --cuff:#06603d;
  --collar:#06603d;
  --detail:#f2c700;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:linear-gradient(#fff,#edf1f3)}
button,input{font:inherit}button{cursor:pointer}
.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:30}
.brand{display:flex;align-items:center;gap:18px}.home{font-size:11px;letter-spacing:.12em;color:#777;text-decoration:none}.logo{font-size:28px;font-weight:900}.logo span{color:var(--orange)}
.top-actions{display:flex;gap:8px}.btn{border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px 13px;font-weight:800}.btn.primary{background:var(--orange);border-color:var(--orange);color:#fff}
.nav{display:flex;gap:8px;justify-content:center;overflow:auto;padding:8px 12px;background:#fff;border-bottom:1px solid var(--line)}
.nav button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 13px;font-weight:800;font-size:12px}.nav button.active{background:#222;color:#fff}
.workspace{width:min(1650px,calc(100% - 20px));margin:12px auto 0;display:grid;grid-template-columns:315px minmax(620px,1fr) 350px;gap:14px;align-items:start}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 34px rgba(25,34,42,.09);overflow:hidden}
.head{padding:15px 16px;border-bottom:1px solid var(--line);font-weight:900;display:flex;align-items:center;gap:10px}.ico{width:34px;height:34px;border:2px solid var(--orange);border-radius:50%;display:grid;place-items:center;color:var(--orange)}
.left-body,.right-body{padding:12px}
.segment{display:flex;border-bottom:1px solid var(--line);margin-bottom:12px}.segment button{flex:1;border:0;background:#fff;padding:10px;font-weight:800;border-bottom:3px solid transparent}.segment button.active{border-color:var(--orange)}
.models{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.model{border:1px solid var(--line);background:#fff;border-radius:11px;padding:6px;text-align:center}.model.active{border:2px solid var(--orange);padding:5px}
.model-preview{height:94px;border-radius:8px;position:relative;overflow:hidden;background:#f4f6f7}.model-preview:before{content:"";position:absolute;inset:11px 18px;border-radius:18px 18px 12px 12px;background:var(--m1);clip-path:polygon(20% 0,80% 0,100% 22%,88% 34%,84% 100%,16% 100%,12% 34%,0 22%)}.model-preview:after{content:"";position:absolute;inset:22px 28px 20px;background:var(--m2);opacity:.55;background-image:repeating-linear-gradient(45deg,transparent 0 9px,var(--m3) 9px 14px)}
.model small{display:block;margin-top:5px;font-size:10px;font-weight:800}
.center{min-height:750px;background:radial-gradient(circle at 50% 12%,#fff,#e9eef1 52%,#d9e1e5);border-radius:18px;box-shadow:0 12px 34px rgba(25,34,42,.12);overflow:hidden;border:1px solid #fff}
.center-head{height:50px;background:rgba(255,255,255,.94);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:8px}.center-head button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-weight:800;font-size:12px}.center-head button.active{background:#222;color:#fff;border-color:#222}
.stage{min-height:700px;display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;padding:12px}
.mock{min-height:650px;position:relative;display:flex;align-items:center;justify-content:center}
.mock-wrap{width:min(520px,96%);aspect-ratio:1079/1457;position:relative}
.mock-layer{position:absolute;inset:0;background:var(--color);-webkit-mask:center/contain no-repeat;mask:center/contain no-repeat}
.front .body{--color:var(--body);-webkit-mask-image:url('assets/front-body-mask.png');mask-image:url('assets/front-body-mask.png')}
.front .left{--color:var(--left);-webkit-mask-image:url('assets/front-left-sleeve-mask.png');mask-image:url('assets/front-left-sleeve-mask.png')}
.front .right{--color:var(--right);-webkit-mask-image:url('assets/front-right-sleeve-mask.png');mask-image:url('assets/front-right-sleeve-mask.png')}
.front .cuffL{--color:var(--cuff);-webkit-mask-image:url('assets/front-left-cuff-mask.png');mask-image:url('assets/front-left-cuff-mask.png')}
.front .cuffR{--color:var(--cuff);-webkit-mask-image:url('assets/front-right-cuff-mask.png');mask-image:url('assets/front-right-cuff-mask.png')}
.front .collar{--color:var(--collar);-webkit-mask-image:url('assets/front-collar-mask.png');mask-image:url('assets/front-collar-mask.png')}
.back .body{--color:var(--body);-webkit-mask-image:url('assets/back-body-mask.png');mask-image:url('assets/back-body-mask.png')}
.back .left{--color:var(--left);-webkit-mask-image:url('assets/back-left-sleeve-mask.png');mask-image:url('assets/back-left-sleeve-mask.png')}
.back .right{--color:var(--right);-webkit-mask-image:url('assets/back-right-sleeve-mask.png');mask-image:url('assets/back-right-sleeve-mask.png')}
.back .cuffL{--color:var(--cuff);-webkit-mask-image:url('assets/back-left-cuff-mask.png');mask-image:url('assets/back-left-cuff-mask.png')}
.back .cuffR{--color:var(--cuff);-webkit-mask-image:url('assets/back-right-cuff-mask.png');mask-image:url('assets/back-right-cuff-mask.png')}
.back .collar{--color:var(--collar);-webkit-mask-image:url('assets/back-collar-mask.png');mask-image:url('assets/back-collar-mask.png')}
.texture{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply;pointer-events:none;filter:contrast(1.04)}
.pattern{position:absolute;inset:0;-webkit-mask:center/contain no-repeat;mask:center/contain no-repeat;opacity:.48;mix-blend-mode:multiply}
.front .pattern{-webkit-mask-image:url('assets/front-body-mask.png');mask-image:url('assets/front-body-mask.png')}
.back .pattern{-webkit-mask-image:url('assets/back-body-mask.png');mask-image:url('assets/back-body-mask.png')}
.pattern.geo{background-color:transparent;background-image:linear-gradient(30deg,var(--detail) 12%,transparent 12.5%,transparent 87%,var(--detail) 87.5%),linear-gradient(150deg,var(--detail) 12%,transparent 12.5%,transparent 87%,var(--detail) 87.5%);background-size:48px 84px}
.pattern.stripes{background:repeating-linear-gradient(90deg,var(--detail) 0 30px,transparent 30px 64px)}
.pattern.diagonal{background:repeating-linear-gradient(135deg,var(--detail) 0 18px,transparent 18px 62px)}
.pattern.none{display:none}
.print{position:absolute;z-index:8;font-weight:900;color:var(--collar);text-shadow:0 1px 2px rgba(255,255,255,.5)}
.front .number{left:50%;top:38%;transform:translate(-50%,-50%);font-size:54px}
.back .name{left:50%;top:31%;transform:translateX(-50%);font-size:24px;white-space:nowrap}
.back .number{left:50%;top:41%;transform:translate(-50%,-50%);font-size:100px}
.label{position:absolute;top:18px;background:#36515e;color:#fff;border-radius:999px;padding:5px 10px;font-size:10px;font-weight:900}
.right-section{padding:13px 15px;border-bottom:1px solid var(--line)}.right-section h3{margin:0 0 10px;font-size:12px;text-transform:uppercase}
.colorrow{display:grid;grid-template-columns:1fr 56px;gap:9px;align-items:center;margin:8px 0}.colorrow label{font-size:12px;font-weight:700;color:#5c656c}input[type=color]{width:56px;height:38px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:3px}
.choicegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.choice{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px;font-size:11px;font-weight:800}.choice.active{border:2px solid var(--orange);padding:8px}
.toggle{width:46px;height:26px;border:0;border-radius:999px;background:#cbd2d7;position:relative}.toggle:after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s}.toggle.on{background:#35b85a}.toggle.on:after{left:23px}.switchline{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700}
.form{display:grid;gap:8px}.form label{font-size:11px;font-weight:800}.form input[type=text]{border:1px solid var(--line);border-radius:9px;padding:9px}
.note{font-size:10px;color:#7a8389;line-height:1.45;margin-top:8px}
@media(max-width:1200px){.workspace{grid-template-columns:280px minmax(560px,1fr)}.right{grid-column:1/-1}}
@media(max-width:850px){.top{height:auto;min-height:66px;padding:10px 12px}.home{display:none}.logo{font-size:22px}.workspace{grid-template-columns:1fr;width:min(100% - 12px,650px)}.center{order:1}.left{order:2}.right{order:3}.stage{grid-template-columns:1fr}.mock{min-height:520px}.models{grid-template-columns:repeat(4,1fr)}}
@media(max-width:520px){.models{grid-template-columns:repeat(3,1fr)}.mock{min-height:430px}.top-actions .btn:first-child{display:none}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><a class="home" href="#">KATTALOGO · PÁGINA INICIAL</a><div class="logo">MEGA <span>SPORTS</span></div></div>
  <div class="top-actions"><button class="btn" onclick="location.reload()">Nova simulação</button><button class="btn primary">Solicitar orçamento</button></div>
</header>
<nav class="nav"><button class="active">Modelos / Estampas</button><button>Acabamentos</button><button>Nome e Número</button><button>Escudo e Patrocínio</button><button>Upload de Imagem</button></nav>

<main class="workspace">
<aside class="panel left">
  <div class="head"><span class="ico">👕</span>Modelos / Estampas</div>
  <div class="left-body">
    <div class="segment"><button class="active">Camisa</button><button>Calção</button><button>Meião</button></div>
    <div class="models" id="models"></div>
  </div>
</aside>

<section class="center">
  <div class="center-head"><button class="active" data-view="both">Frente + Costas</button><button data-view="front">Frente</button><button data-view="back">Costas</button></div>
  <div class="stage">
    <div class="mock front">
      <span class="label">FRENTE</span>
      <div class="mock-wrap">
        <div class="mock-layer body"></div><div class="mock-layer left"></div><div class="mock-layer right"></div>
        <div class="mock-layer cuffL"></div><div class="mock-layer cuffR"></div><div class="mock-layer collar"></div>
        <div class="pattern geo" id="patternF"></div>
        <img class="texture" src="assets/front-texture.png" alt="">
        <div class="print number" id="frontNumber">10</div>
      </div>
    </div>
    <div class="mock back">
      <span class="label">COSTAS</span>
      <div class="mock-wrap">
        <div class="mock-layer body"></div><div class="mock-layer left"></div><div class="mock-layer right"></div>
        <div class="mock-layer cuffL"></div><div class="mock-layer cuffR"></div><div class="mock-layer collar"></div>
        <div class="pattern geo" id="patternB"></div>
        <img class="texture" src="assets/back-texture.png" alt="">
        <div class="print name" id="backName">SEU NOME</div>
        <div class="print number" id="backNumber">10</div>
      </div>
    </div>
  </div>
</section>

<aside class="panel right">
  <div class="head"><span class="ico">◉</span>Personalização</div>
  <div class="right-section">
    <div class="switchline"><span>Sincronizar mangas</span><button class="toggle on" id="syncSleeves"></button></div>
  </div>
  <div class="right-section">
    <h3>Cores da camisa</h3>
    <div class="colorrow"><label>Corpo</label><input id="bodyColor" type="color" value="#ffe44d"></div>
    <div class="colorrow"><label>Manga esquerda</label><input id="leftColor" type="color" value="#ffe44d"></div>
    <div class="colorrow"><label>Manga direita</label><input id="rightColor" type="color" value="#ffe44d"></div>
    <div class="colorrow"><label>Gola</label><input id="collarColor" type="color" value="#06603d"></div>
    <div class="colorrow"><label>Punho</label><input id="cuffColor" type="color" value="#06603d"></div>
    <div class="colorrow"><label>Cor da estampa</label><input id="detailColor" type="color" value="#f2c700"></div>
  </div>
  <div class="right-section">
    <h3>Estampa do corpo</h3>
    <div class="choicegrid">
      <button class="choice active" data-pattern="geo">Geométrica</button>
      <button class="choice" data-pattern="stripes">Listras</button>
      <button class="choice" data-pattern="diagonal">Diagonal</button>
      <button class="choice" data-pattern="none">Lisa</button>
    </div>
  </div>
  <div class="right-section">
    <h3>Acabamentos</h3>
    <div class="choicegrid">
      <button class="choice active" data-collar="v">Gola V</button>
      <button class="choice" data-collar="round">Redonda</button>
      <button class="choice" data-collar="madrid">Madrid</button>
    </div>
    <div class="switchline" style="margin-top:10px"><span>Usar punho</span><button class="toggle on" id="useCuff"></button></div>
  </div>
  <div class="right-section">
    <h3>Nome e número</h3>
    <div class="form"><label>Nome</label><input id="nameInput" type="text" value="SEU NOME"><label>Número</label><input id="numInput" type="text" value="10" maxlength="2"></div>
    <div class="note">Nesta prova, a prioridade é o realismo do mockup 2D e a troca de cores por partes.</div>
  </div>
</aside>
</main>

<script>
const R=document.documentElement;
const state={sync:true,cuff:true,pattern:"geo"};
const models=[
 ["Brasil 570","#ffe44d","#ffe44d","#06603d","#f2c700"],
 ["Azul 569","#0d3978","#174e92","#ffffff","#1e75c8"],
 ["Vermelho 568","#c92531","#e0474e","#ffffff","#7f121c"],
 ["Preto 564","#171717","#2b2b2b","#ffffff","#666666"],
 ["Menta 563","#d8f2ed","#8bd0c5","#184e4a","#ffffff"],
 ["Verde 562","#15914e","#0b713a","#ffffff","#11c66a"]
];
const box=document.getElementById("models");
models.forEach((m,i)=>{
 const b=document.createElement("button");b.className="model"+(i===0?" active":"");
 b.style.setProperty("--m1",m[1]);b.style.setProperty("--m2",m[2]);b.style.setProperty("--m3",m[4]);
 b.innerHTML=`<div class="model-preview"></div><small>${m[0]}</small>`;
 b.onclick=()=>{document.querySelectorAll(".model").forEach(x=>x.classList.remove("active"));b.classList.add("active");
   setColor("body",m[1]);setColor("left",m[2]);setColor("right",m[2]);setColor("collar",m[3]);setColor("cuff",m[3]);setColor("detail",m[4]);
   bodyColor.value=m[1];leftColor.value=m[2];rightColor.value=m[2];collarColor.value=m[3];cuffColor.value=m[3];detailColor.value=m[4];
 };
 box.appendChild(b);
});
function setColor(name,val){R.style.setProperty("--"+name,val)}
bodyColor.oninput=e=>setColor("body",e.target.value);
leftColor.oninput=e=>{setColor("left",e.target.value);if(state.sync){setColor("right",e.target.value);rightColor.value=e.target.value}};
rightColor.oninput=e=>{setColor("right",e.target.value);if(state.sync){setColor("left",e.target.value);leftColor.value=e.target.value}};
collarColor.oninput=e=>setColor("collar",e.target.value);
cuffColor.oninput=e=>setColor("cuff",e.target.value);
detailColor.oninput=e=>setColor("detail",e.target.value);
syncSleeves.onclick=e=>{state.sync=!state.sync;e.currentTarget.classList.toggle("on",state.sync)};
useCuff.onclick=e=>{state.cuff=!state.cuff;e.currentTarget.classList.toggle("on",state.cuff);document.querySelectorAll(".cuffL,.cuffR").forEach(x=>x.style.display=state.cuff?"block":"none")};
document.querySelectorAll("[data-pattern]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-pattern]").forEach(x=>x.classList.toggle("active",x===b));["patternF","patternB"].forEach(id=>{const p=document.getElementById(id);p.className="pattern "+b.dataset.pattern})});
document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-view]").forEach(x=>x.classList.toggle("active",x===b));document.querySelector(".front").style.display=b.dataset.view==="back"?"none":"flex";document.querySelector(".back").style.display=b.dataset.view==="front"?"none":"flex"});
nameInput.oninput=e=>backName.textContent=e.target.value.toUpperCase();
numInput.oninput=e=>{frontNumber.textContent=e.target.value||"0";backNumber.textContent=e.target.value||"0"};
document.querySelectorAll("[data-collar]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-collar]").forEach(x=>x.classList.toggle("active",x===b));});
</script>
</body></html>
